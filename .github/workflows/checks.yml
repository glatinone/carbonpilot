# The repository had no CI, so every "105 tests pass" claim was only true on the
# machine that ran them. This makes the claim checkable from the commit itself.
#
# The steps mirror exactly what the project's own gate is: pytest for the engine,
# tsc for the types, and a real static build because that export is the artifact
# that gets deployed — a green typecheck over a failing build would be worse than
# no check at all.
#
# No secrets are needed. The agent tests exercise the deterministic fallback, so
# the suite runs with no API key present, which is the honest thing to verify:
# a check that only passes with a credential in the environment is not a check.

name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build the static export
        working-directory: frontend
        run: npm run build
