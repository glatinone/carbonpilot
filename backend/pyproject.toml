[project]
name = "carbonpilot-backend"
version = "0.1.0"
description = "CarbonPilot — AI Carbon Decision Engine (FastAPI backend)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "python-multipart>=0.0.12,<1",
    "python-dotenv>=1.0,<2",
    "httpx>=0.28,<1",
    "google-genai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
